# Profesor Liceu pe Hetzner: aplicația Streamlit + webhook Stripe + Caddy (HTTPS automat, Let's Encrypt).
# Pornire:  docker compose up -d --build      (detalii: deploy/README.md)
services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    expose: ["8501"]

  webhook:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "billing_webhook.main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: deploy/webhook.env
    expose: ["8001"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, webhook]

volumes:
  caddy_data:
  caddy_config:
